<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <script>(()=>{let t;try{t=localStorage.getItem("gm-theme")}catch(e){}document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")})()</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>সব যানবাহন · Gari Mela</title>
  <meta name="description" content="গাড়িমেলার সব ব্যবহৃত পিকআপ, ট্রাক, বাস ও টিপার: ধরন, ব্র্যান্ড, জেলা ও দাম দিয়ে খুঁজুন।">
  <meta name="theme-color" content="#ED1C25">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://garimela-storage.sgp1.cdn.digitaloceanspaces.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wdth,wght@75..125,300..800&display=swap">
  <link rel="stylesheet" href="assets/site.css">
  <script src="assets/site.js" defer></script>
</head>
<body data-page="listing">
<header id="site-header"></header>
<main id="main" class="wrap">
  <div class="page-hero list-head">
    <div>
      <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html" data-i18n="home"></a><span>/</span><span data-i18n="vehicles"></span></nav>
      <h1 id="list-title" data-i18n="vehicles"></h1>
    </div>
    <p id="result-count" aria-live="polite"></p>
  </div>

  <form class="filters glass" id="filters" role="search">
    <label class="field"><span class="sr-only" data-i18n="searchBtn"></span>
      <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#search"/></svg>
      <input name="q" type="search" enterkeyhint="search" data-i18n-ph="searchPh"></label>
    <label class="field"><span class="sr-only" data-i18n="type"></span><select name="type"></select></label>
    <label class="field"><span class="sr-only" data-i18n="brand"></span><select name="brand"></select></label>
    <label class="field"><span class="sr-only" data-i18n="depot"></span><select name="depot"></select></label>
    <label class="field"><span class="sr-only" data-lang="bn">সর্বোচ্চ দাম</span><span class="sr-only" data-lang="en">Max price</span>
      <select name="max"></select></label>
    <label class="field"><span class="sr-only" data-lang="bn">সাজান</span><span class="sr-only" data-lang="en">Sort</span>
      <select name="sort"></select></label>
    <label class="check"><input type="checkbox" name="sold" value="1"><span data-lang="bn">বিক্রিত গাড়িও দেখান</span><span data-lang="en">Include sold</span></label>
    <button class="btn btn--ghost filter-toggle" id="filter-toggle" type="button" aria-expanded="false" aria-controls="filters">
      <svg class="icon" aria-hidden="true"><use href="assets/icons.svg#sliders"/></svg><span data-lang="bn">ফিল্টার</span><span data-lang="en">Filters</span></button>
  </form>
  <div class="chips" id="chips"></div>

  <div class="grid" id="results">
    <div class="skel" style="height:380px"></div><div class="skel" style="height:380px"></div><div class="skel" style="height:380px"></div><div class="skel" style="height:380px"></div>
  </div>
  <button class="btn btn--dark" id="load-more" type="button" hidden><span data-lang="bn">আরও দেখুন</span><span data-lang="en">Show more</span></button>
</main>
<footer id="site-footer"></footer>
</body>
</html>
